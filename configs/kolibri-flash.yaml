# kolibriforge small/fast configuration (latency-critical, "flash" analogue)
model: kolibri-flash
hidden: 64
vocab: 128
seed: 0

backend:
  name: mock
  model: kolibri-flash
  api_base: ""
  api_key: ""
  temperature: 0.0

moe:
  num_experts: 4
  top_k: 2
  hidden: 64
  expert_dim: 128
  sparse_ratio: 8.0

merlin:
  enabled: true
  abstain_threshold: 0.5
  hallucination_penalty: 1.5
  abstain_reward: 0.2
  correctness_reward: 1.0

budget:
  enabled: true
  default_level: low
  max_extra_tokens: 128

train:
  steps: 40
  lr: 0.05
  reward_noise: 0.5
  algorithm: merlin-rl
