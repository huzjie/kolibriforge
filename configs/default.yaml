# kolibriforge default configuration
model: kolibri-flash
hidden: 128
vocab: 256
seed: 0

backend:
  name: mock
  model: kolibri-flash
  api_base: ""
  api_key: ""
  temperature: 0.0

moe:
  num_experts: 8
  top_k: 2
  hidden: 128
  expert_dim: 256
  sparse_ratio: 22.6

merlin:
  enabled: true
  abstain_threshold: 0.5
  hallucination_penalty: 1.5
  abstain_reward: 0.2
  correctness_reward: 1.0

budget:
  enabled: true
  default_level: medium
  max_extra_tokens: 512

train:
  steps: 60
  lr: 0.05
  reward_noise: 0.5
  algorithm: merlin-rl
