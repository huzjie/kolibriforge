apiVersion: apps/v1
kind: Deployment
metadata:
  name: kolibriforge
  labels:
    app: kolibriforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kolibriforge
  template:
    metadata:
      labels:
        app: kolibriforge
    spec:
      containers:
        - name: kolibriforge
          image: ghcr.io/kolibriforge/kolibriforge:latest
          ports:
            - containerPort: 8000
          env:
            - name: KOLIBRI_CONFIG
              value: /app/configs/default.yaml
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
