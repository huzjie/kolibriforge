replicaCount: 2

image:
  repository: ghcr.io/kolibriforge/kolibriforge
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

config: /app/configs/default.yaml
